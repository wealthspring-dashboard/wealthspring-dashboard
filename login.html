<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In | Wealthspring Financial Services</title>
<style>
    :root {
        --primary-forest: #1a3a34;
        --primary-darker: #0f1f1d;
        --accent-gold: #c9a961;
        --text-light: #e8e6e1;
        --text-muted: #a8a39f;
        --status-red: #e74c3c;
        --border-subtle: rgba(232, 230, 225, 0.12);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: var(--primary-darker);
        color: var(--text-light);
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
    }

    .login-card {
        background: var(--primary-forest);
        border: 1px solid var(--border-subtle);
        border-radius: 12px;
        padding: 40px 36px;
        width: 100%;
        max-width: 380px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
    }

    .logo {
        display: block;
        height: 50px;
        width: auto;
        margin: 0 auto 32px auto;
    }

    h1 {
        font-family: Georgia, serif;
        font-weight: 400;
        font-size: 20px;
        text-align: center;
        margin-bottom: 28px;
        color: var(--text-light);
    }

    label {
        display: block;
        font-size: 13px;
        color: var(--text-muted);
        margin-bottom: 8px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
    }

    input[type="password"] {
        width: 100%;
        padding: 12px 14px;
        font-size: 15px;
        background: var(--primary-darker);
        border: 1px solid var(--border-subtle);
        border-radius: 8px;
        color: var(--text-light);
        margin-bottom: 8px;
    }

    input[type="password"]:focus {
        outline: none;
        border-color: var(--accent-gold);
    }

    button {
        width: 100%;
        padding: 13px;
        margin-top: 16px;
        background: var(--accent-gold);
        color: var(--primary-darker);
        border: none;
        border-radius: 8px;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        transition: opacity 0.15s ease;
    }

    button:hover { opacity: 0.9; }
    button:disabled { opacity: 0.6; cursor: default; }

    .error {
        color: var(--status-red);
        font-size: 13px;
        margin-top: 10px;
        min-height: 18px;
    }

    .footer-note {
        text-align: center;
        color: var(--text-muted);
        font-size: 12px;
        margin-top: 24px;
    }
</style>
</head>
<body>
    <div class="login-card">
        <img class="logo" src="assets/logo-dark-bg.png" alt="Wealthspring Financial Services">
        <h1>Sign in to the dashboard</h1>
        <form id="loginForm">
            <label for="password">Team Password</label>
            <input type="password" id="password" name="password" autocomplete="current-password" autofocus required>
            <div class="error" id="errorMsg"></div>
            <button type="submit" id="submitBtn">Sign In</button>
        </form>
        <div class="footer-note">Wealthspring Financial Services &middot; Internal Use Only</div>
    </div>

    <script>
        const form = document.getElementById('loginForm');
        const errorMsg = document.getElementById('errorMsg');
        const submitBtn = document.getElementById('submitBtn');

        function getNextUrl() {
            const params = new URLSearchParams(window.location.search);
            const next = params.get('next');
            if (next && next.startsWith('/') && !next.startsWith('//')) {
                return next;
            }
            return '/';
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorMsg.textContent = '';
            submitBtn.disabled = true;
            submitBtn.textContent = 'Signing in…';

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password: document.getElementById('password').value }),
                });

                if (res.ok) {
                    window.location.href = getNextUrl();
                    return;
                }

                const data = await res.json().catch(() => ({}));
                errorMsg.textContent = data.error || 'Something went wrong. Please try again.';
            } catch (err) {
                errorMsg.textContent = 'Network error. Please try again.';
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Sign In';
            }
        });

        fetch('/api/session')
            .then((r) => r.json())
            .then((data) => {
                if (data.authenticated) window.location.href = getNextUrl();
            })
            .catch(() => {});
    </script>
</body>
</html>
